<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grapplehook</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 12px; width: 220px; }
    label, select, button { display: block; width: 100%; }
    select, button { margin-top: 6px; padding: 4px; font: inherit; }
    button:disabled { opacity: 0.5; }
    #note { color: #666; margin: 8px 0 0; }
  </style>
</head>
<body>
  <label for="quality">Quality</label>
  <select id="quality">
    <option value="best">Best</option>
    <option value="2160">2160p</option>
    <option value="1440">1440p</option>
    <option value="1080">1080p</option>
    <option value="720">720p</option>
    <option value="480">480p</option>
    <option value="360">360p</option>
    <option value="audio">Audio only</option>
  </select>
  <button id="send" disabled>Send to Grapplehook</button>
  <p id="note" hidden>There's no single video on this page.</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
