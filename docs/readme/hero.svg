<title id="t">Grapplehook extension: send it from YouTube. One click under the video, and Grapplehook opens with it.</title>
<style>
.drop { animation: drop 1.1s cubic-bezier(.3,.0,.2,1) both; }
.swing { transform-origin: 328.5px 0; animation: swing 2.6s .55s cubic-bezier(.37,0,.63,1) both; }
.flutter { animation: flutter 2.2s .62s cubic-bezier(.37,0,.63,1) both; }
.word { animation: word .9s .5s cubic-bezier(.16,1,.3,1) both; }
.w2 { animation-delay: .68s; }
.sub { animation: sub .8s .85s cubic-bezier(.16,1,.3,1) both; }
@keyframes drop { 0% { transform: translateY(-460px) } 55% { transform: translateY(14px) } 72% { transform: translateY(-5px) } 86% { transform: translateY(2px) } 100% { transform: none } }
@keyframes swing { 0% { transform: rotate(0) } 18% { transform: rotate(7deg) } 40% { transform: rotate(-4.5deg) } 60% { transform: rotate(2.4deg) } 80% { transform: rotate(-1deg) } 100% { transform: rotate(0) } }
@keyframes flutter { 0% { transform: rotate(0) } 20% { transform: rotate(-9deg) } 42% { transform: rotate(5deg) } 64% { transform: rotate(-2.5deg) } 84% { transform: rotate(1deg) } 100% { transform: rotate(0) } }
@keyframes word { from { clip-path: inset(0 100% 0 0); transform: translateX(-24px) } to { clip-path: inset(0 0 0 0); transform: none } }
@keyframes sub { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
